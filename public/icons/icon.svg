  <rect x="58" y="82" width="42" height="4" rx="2" fill="#e28a9d" opacity="0.35" />
  <rect x="58" y="94" width="46" height="4" rx="2" fill="#e28a9d" opacity="0.3" />
  <rect x="58" y="106" width="38" height="4" rx="2" fill="#e28a9d" opacity="0.25" />

  <!-- 右侧书页线条 -->
