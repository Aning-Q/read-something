<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffb7c5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff9bb1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff7f9a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff5f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffedf1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景圆形 -->
  <circle cx="96" cy="96" r="88" fill="url(#bgGrad)" />

  <!-- 书本主体 -->
  <rect x="46" y="52" width="100" height="88" rx="10" fill="url(#pageGrad)" />

  <!-- 书脊 -->
